<div class="login-container">
  <button class="back-btn" type="button" (click)="goHome()" aria-label="На главную">
    <span class="back-arrow">←</span>
  </button>

  <h1 class="logo logo-font">
    <span class="consonant">М</span>
    <span class="vowel">Е</span>
    <span class="consonant">Т</span>
    <span class="consonant">К</span>
    <span class="vowel">А</span>
  </h1>

  <div class="message-container">
    <h2 class="message-title">Письмо с восстановлением отправлено</h2>
    <p class="message-text" *ngIf="email">
      На почту <strong>{{ email }}</strong> отправлено письмо с инструкциями по восстановлению пароля.
    </p>
    <p class="message-text" *ngIf="!email">
      На вашу почту отправлено письмо с инструкциями по восстановлению пароля.
    </p>
    <p class="message-hint">
      Проверьте папку «Входящие» и «Спам».
    </p>
  </div>
</div>
