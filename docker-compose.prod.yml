services:
  # Фронтенд (Angular раздается через Nginx)
  frontend:
    build:
      context: ./contest-app
      dockerfile: Dockerfile.prod
    container_name: mini_t1_frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    networks:
      - mini_t1_network

  # Бэкенд (Flask)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mini_t1_app
    restart: unless-stopped
    volumes:
      # Убрано монтирование .:/app для защиты исходного кода
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    ports:
      - "5000:5000"
    env_file:
      - .env.prod
    environment:
      - FLASK_APP=app:create_app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mini_t1_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # База данных
  db:
    image: postgres:15-alpine
    container_name: mini_t1_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-hackathon_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_prod_pass_123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mini_t1_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-hackathon_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Nginx (основной прокси)
  nginx:
    image: nginx:alpine
    container_name: mini_t1_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./uploads:/app/uploads:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      web:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - mini_t1_network

# Сети
networks:
  mini_t1_network:
    driver: bridge
    name: mini_t1_network

# Тома
volumes:
  postgres_data:
